<!DOCTYPE html>
<html lang="es" data-tema="guinda">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consultas al lago</title>
    <meta name="description" content="Las consultas SQL detrás del mapa del lago de obra pública y la comparación por hash entre el almacén PostgreSQL y el lago.">
    <link rel="stylesheet" href="sitio.css">
    <script src="comun.js"></script>
</head>
<body>
<header class="barra">
    <a class="marca" href="./"><span class="marca__sello" aria-hidden="true"></span><span class="marca__nombre" data-t="marca"></span></a>
    <button type="button" class="boton-barra barra__abrir" id="abrirMenu" aria-expanded="false" aria-controls="menuBarra" data-t="menu"></button>
    <div class="barra__menu" id="menuBarra">
        <nav class="barra__nav" aria-label="Secciones">
            <a href="./" data-t="nav.mapa"></a>
            <a href="consultas.html" aria-current="page" data-t="nav.consultas"></a>
            <a href="https://github.com/gabrielhuav/PublicMunicipalWorks_Lakehouse" data-t="nav.repo"></a>
        </nav>
        <div class="barra__acciones">
            <div class="segmentado" role="group" data-t-aria="tema.titulo">
                <button type="button" data-tema-boton="guinda" data-t="tema.guinda"></button>
                <button type="button" data-tema-boton="azul" data-t="tema.azul"></button>
            </div>
            <button type="button" class="boton-barra" id="modo"></button>
            <button type="button" class="boton-barra" id="idioma"></button>
        </div>
    </div>
</header>

<main class="contenido">
    <h1 data-t="titulo"></h1>
    <p data-t="lema"></p>
    <p class="aviso" data-t="aviso" data-html></p>
    <p id="estado" data-t="cargando"></p>
    <section class="panel tarjeta">
        <h2 data-t="lago.titulo"></h2>
        <p data-t="lago.texto"></p>
        <div class="tabla" id="lago"></div>
        <p class="nota" id="lagoNota"></p>
    </section>
    <h2 data-t="capas.titulo"></h2>
    <p data-t="capas.texto"></p>
    <pre id="pasos"></pre>
    <div id="lista"></div>
</main>

<script src="consultas.js"></script>
</body>
</html>
