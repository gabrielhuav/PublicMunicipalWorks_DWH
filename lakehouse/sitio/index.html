<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Obra pública federalizada</title>
    <meta name="description" content="Mapa del lago de datos de obra pública federalizada en México, 2020-2025, con datos oficiales de SHCP, INEGI y CONEVAL. Cada capa es el resultado de una consulta a la base de datos.">
    <link rel="stylesheet" href="vendor/leaflet-1.9.4.css">
    <link rel="stylesheet" href="sitio.css">
</head>
<body>
<header class="barra">
    <div>
        <h1 data-t="titulo"></h1>
        <p data-t="lema"></p>
    </div>
    <nav>
        <a href="./" aria-current="page" data-t="nav.mapa"></a>
        <a href="consultas.html" data-t="nav.consultas"></a>
        <a href="https://github.com/gabrielhuav/PublicMunicipalWorks_Lakehouse" data-t="nav.repo"></a>
        <button type="button" id="idioma"></button>
    </nav>
</header>
<p class="aviso" data-t="aviso" data-html></p>

<main class="rejilla">
    <aside class="panel control">
        <label for="buscar" data-t="b.titulo"></label>
        <input type="search" id="buscar" class="buscar" autocomplete="off">
        <ul id="resultados" class="resultados" hidden></ul>
        <p class="nota" data-t="b.nota"></p>
        <label for="indicador" data-t="c.indicador"></label>
        <select id="indicador"></select>
        <label for="ciclo" data-t="c.ciclo"></label>
        <select id="ciclo"></select>
        <p id="notaIndicador" class="nota"></p>
        <label class="casilla"><input type="checkbox" id="obras"> <span data-t="c.obras"></span></label>
        <select id="estadoObras"></select>
        <p class="nota" data-t="c.obras.nota"></p>
        <fieldset id="filtros" class="filtros" hidden>
            <legend data-t="f.titulo"></legend>
            <div id="filtrosEstatus"></div>
            <label class="casilla"><input type="checkbox" id="soloMarcas"> <span data-t="f.marcas"></span></label>
            <p class="nota" id="filtroConteo"></p>
        </fieldset>
        <button type="button" class="boton" id="temascaltepec" data-t="c.temascaltepec"></button>
        <ul class="conteos" id="conteos"></ul>
    </aside>

    <div>
        <p id="estado" class="estado" data-t="cargando"></p>
        <div id="mapa" role="region" aria-label="Mapa"></div>
    </div>

    <aside class="panel">
        <h2 id="leyendaTitulo"></h2>
        <div id="leyenda"></div>
        <div id="detalle"></div>
        <div class="origen" id="origen"></div>
    </aside>
</main>

<div id="comparar" class="comparar" hidden role="dialog" aria-modal="true" aria-labelledby="compararTitulo">
    <div class="comparar__caja">
        <div class="comparar__cabecera">
            <h2 id="compararTitulo"></h2>
            <button type="button" id="cerrarComparar" data-t="cmp.cerrar"></button>
        </div>
        <div class="comparar__mapas">
            <figure><div id="mapaAntes" class="comparar__mapa"></div><figcaption></figcaption></figure>
            <figure><div id="mapaAhora" class="comparar__mapa"></div><figcaption></figcaption></figure>
        </div>
        <p class="nota" data-t="cmp.nota"></p>
    </div>
</div>

<script src="vendor/leaflet-1.9.4.js"></script>
<script src="comun.js"></script>
<script src="mapa-teselas.js"></script>
<script src="mapa.js"></script>
</body>
</html>
