name: Publish the lake site

on:
  push:
    branches: [main]
    paths:
      - 'lakehouse/sitio/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # The site is published exactly as the repository holds it, with the files that
          # lakehouse/verificacion/verificar_capas.py compares against the databases.
          path: lakehouse/sitio
      - id: deployment
        uses: actions/deploy-pages@v4
